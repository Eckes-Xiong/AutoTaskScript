name: 一点万象ydwx.js

on:
  workflow_dispatch:
  schedule:
    - cron: "13 23 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: 检查当前 CI 服务器 IP 及访问情况
        run: |
          # 获取当前公网 IP
          echo "当前 CI 服务器 IP："
          curl -s http://icanhazip.com  # 或 https://api.ipify.org
          
          # 测试目标服务器是否可访问（不发送业务请求，仅检查基础连通性）
          echo "测试访问目标服务器..."
          curl -v https://app.mixcapp.com  # 仅访问域名根路径，避免接口权限问题
          # 或测试目标接口的 OPTIONS 方法（预检请求）
          curl -X OPTIONS -v https://app.mixcapp.com/mixc/gateway

    
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Cache node_modules
        uses: actions/cache@v3
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ matrix.node-version }}-nodeModules-${{ hashFiles('package-lock.json') }}-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.node-version }}-nodeModules-

      - name: Install dependency packages
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          npm install

      - name: Start running the script
        run: |
          node src/eckes/js/ydwx.js
        env:
          MIYOUSHE_COOKIE: ${{ secrets.MIYOUSHE_COOKIE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
          BARK_PUSH: ${{ secrets.BARK_PUSH }}
          BARK_SOUND: ${{ secrets.BARK_SOUND }}
          DD_BOT_TOKEN: ${{ secrets.DD_BOT_TOKEN }}
          DD_BOT_SECRET: ${{ secrets.DD_BOT_SECRET }}
          QYWX_KEY: ${{ secrets.QYWX_KEY }}
          IGOT_PUSH_KEY: ${{ secrets.IGOT_PUSH_KEY }}
          PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
          PUSH_PLUS_USER: ${{ secrets.PUSH_PLUS_USER }}

      - name: Delete Workflow Runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 1
          keep_minimum_runs: 1
